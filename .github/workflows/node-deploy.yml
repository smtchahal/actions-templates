name: Node deploy

on:
  workflow_call:
    inputs:
      commands:
        description: Shell commands to run with the Cloudflare credentials in the environment, one per line.
        type: string
        required: true
      working-directory:
        description: Directory the commands run in. Dependencies are always installed from the repo root.
        type: string
        default: "."
      node-version:
        type: string
        default: "24"
      node-version-file:
        type: string
        default: ""
      minimum-release-age:
        description: Minimum minimumReleaseAge (minutes) the repo's pnpm-workspace.yaml must set. 0 disables the age check.
        type: number
        default: 4320
      artifact-name:
        description: Download this artifact before running the commands. Empty skips the download.
        type: string
        default: ""
      artifact-path:
        type: string
        default: ""
    secrets:
      CLOUDFLARE_API_TOKEN:
        required: true
      CLOUDFLARE_ACCOUNT_ID:
        required: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Age policy lives in the committed file, not a CI env var, so local installs get the same protection.
      # 11.1.3 is the first pnpm that re-validates lockfile entries against it on frozen installs.
      - env:
          MIN_AGE: ${{ inputs.minimum-release-age }}
        run: |
          if [ ! -f package.json ]; then
            echo "::error::package.json is missing"
            exit 1
          fi
          pm=$(yq -o=y '.packageManager // ""' package.json)
          pm_re='^pnpm@([0-9]+\.[0-9]+\.[0-9]+)(\+[a-z0-9]+\.[0-9a-f]+)?$'
          if ! [[ $pm =~ $pm_re ]]; then
            echo "::error file=package.json::packageManager must be pnpm@X.Y.Z with an exact version, got '$pm'"
            exit 1
          fi
          version=${BASH_REMATCH[1]}
          if [ "$(printf '%s\n' 11.1.3 "$version" | sort -V | head -n 1)" != 11.1.3 ]; then
            echo "::error file=package.json::pnpm $version is below the required 11.1.3"
            exit 1
          fi
          if [ "$MIN_AGE" -gt 0 ]; then
            if [ ! -f pnpm-workspace.yaml ]; then
              echo "::error::pnpm-workspace.yaml is missing; it must set minimumReleaseAge to at least $MIN_AGE"
              exit 1
            fi
            age=$(yq '.minimumReleaseAge // ""' pnpm-workspace.yaml)
            if ! [[ $age =~ ^[0-9]+$ ]] || [ "$age" -lt "$MIN_AGE" ]; then
              echo "::error file=pnpm-workspace.yaml::minimumReleaseAge is '$age', required at least $MIN_AGE minutes"
              exit 1
            fi
          fi
        shell: bash

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ inputs.node-version-file == '' && inputs.node-version || '' }}
          node-version-file: ${{ inputs.node-version-file }}
          cache: pnpm

      # Frozen installs re-check lockfile entries against minimumReleaseAge, so they must run under the pinned pnpm.
      - run: |
          expected=$(yq -o=y '.packageManager' package.json)
          expected=${expected#pnpm@}
          expected=${expected%%+*}
          actual=$(pnpm --version)
          if [ "$actual" != "$expected" ]; then
            echo "::error::pnpm $actual is active but packageManager pins $expected"
            exit 1
          fi
          pnpm install --frozen-lockfile
        shell: bash

      - if: inputs.artifact-name != ''
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ inputs.artifact-name }}
          path: ${{ inputs.artifact-path }}

      # Credentials are scoped to this step so install scripts and third-party actions never see them.
      - run: ${{ inputs.commands }}
        shell: bash
        working-directory: ${{ inputs.working-directory }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
